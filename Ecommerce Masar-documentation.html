ducts, add items to the cart, place orders, apply coupons, and leave reviews.\n\n    The backend also supports admin functions such as managing categories, sub-categories, brands, products, orders, and reviews. It handles important business rules like checking if a user is logged in, validating data, protecting routes, uploading images, and returning clear error messages when something goes wrong.\n\n    In simple words, this project is the backend engine behind an online shopping website. It connects the frontend with the database and manages all the main store actions safely and efficiently.\n\n    ### **Main features**\n\n    - User registration and login\n    - Profile and account updates\n    - Password reset and OTP verification\n    - Address management\n    - Product listing and product details\n    - Category and sub-category management\n    - Brand management\n    - Cart operations\n    - Coupon usage\n    - Order placement and order tracking\n    - Review and rating system\n    - Image upload support\n    - Validation and error handling\n\n    ### **Project purpose**\n\n    The goal of this project is to provide a reliable backend for an e-commerce application where customers can browse products, add them to cart, place orders, and manage their account, while admins can manage store data and operations.\n\n    If you want, I can also make this:\n\n    - shorter and more professional,\n    - more detailed for API docs,\n    - or simpler for non-technical readers.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n      - assets\n    exportedAt: '2026-10-04T17:35:58.953Z'\n    exportedUsing: Bruno/4.2.1\n";
